<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5f8">
    <title>{{TITLE}} video · Deep Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../header.css">
    <link rel="stylesheet" href="../../styles.css">
  </head>
  <body>
    {{SITE_HEADER}}
    <main class="container video-page">
      <a class="back-link" href="../../">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 4-6 6 6 6M5 10h11"/></svg>
        Back to papers
      </a>
      <h1>{{TITLE}}</h1>
      <video controls playsinline preload="metadata" poster="../../{{COVER}}" aria-label="{{TITLE}} video">
        <source src="../../{{VIDEO}}" type="video/mp4">
        Your browser does not support this video. <a href="../../{{VIDEO}}">Download the MP4</a>.
      </video>
      <a class="note-link" href="../../{{NOTE}}">Read the note</a>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">Just my notes.</div>
    </footer>
  </body>
</html>
