<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5f8">
    <meta name="description" content="Deep Notes: visual explanations of research papers, with companion videos.">
    <title>Deep Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./" aria-label="Deep Notes home">Deep Notes<span class="brand-dot" aria-hidden="true">.</span></a>
        <a class="home-link" href="https://clamboley.github.io/" aria-label="Visit Corentin's home website" title="Visit my homepage">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 6 26 20M35 6 22 20"/>
            <circle cx="11.8" cy="4.8" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="36.2" cy="4.8" r="1.5" fill="currentColor" stroke="none"/>
            <ellipse cx="24" cy="26" rx="15" ry="5.3"/>
            <path d="M9 26v10c0 3 6.7 5.5 15 5.5S39 39 39 36V26M15 31v8M33 31v8"/>
            <path d="M11 36c3.7 2.3 8.1 3.4 13 3.4s9.3-1.1 13-3.4"/>
          </svg>
        </a>
      </div>
    </header>

    <main class="container">
      <h1 class="sr-only">Deep Notes</h1>
      <section class="library" aria-label="Paper library">
        <div class="library-bar">
          <div class="filters" role="group" aria-label="Filter papers">
            <div class="filter-field">
              <label class="sr-only" for="year-filter">Filter by year</label>
              <select id="year-filter" aria-label="Filter by year">
                {{YEAR_OPTIONS}}
              </select>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg>
            </div>
            <div class="filter-field">
              <label class="sr-only" for="label-filter">Filter by label</label>
              <select id="label-filter" aria-label="Filter by label">
                {{LABEL_OPTIONS}}
              </select>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg>
            </div>
          </div>
          <form class="search" role="search" onsubmit="return false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <label class="sr-only" for="paper-search">Search papers</label>
            <input id="paper-search" type="search" placeholder="Search papers" autocomplete="off" spellcheck="false">
          </form>
        </div>

        <div class="paper-grid" id="paper-grid">
          {{PAPER_CARDS}}
        </div>
        <p class="sr-only" id="result-status" aria-live="polite"></p>
        <p class="empty-state" id="empty-state" hidden>No papers match. Try another year, label, or search.</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Just my notes.</span>
      </div>
    </footer>
  </body>
</html>
