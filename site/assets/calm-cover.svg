<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
  <title id="title">CALM visual summary</title>
  <desc id="desc">A waveform is encoded by a VAE into one continuous vector per frame, replacing stacked RVQ levels; a language model and consistency head then sample the next vector.</desc>
  <rect width="760" height="490" fill="#e7ebf0"/>
  <rect x="23" y="23" width="714" height="444" rx="16" fill="#f8f9fb" stroke="#cbd4df"/>
  <text x="55" y="76" fill="#5a6676" font-family="monospace" font-size="17" letter-spacing="2">SPEECH  /  MUSIC  /  NO RVQ</text>
  <path d="M54 95H706" stroke="#d3dae3"/>

  <defs><marker id="clmA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8390a0"/></marker></defs>

  <!-- waveform: observed audio -->
  <path d="M46 240Q52 220 58 240T70 240T82 240T94 240T106 240T118 240" fill="none" stroke="#2f62d6" stroke-width="3" stroke-linecap="round"/>
  <text x="82" y="276" fill="#2f62d6" font-family="monospace" font-size="14" text-anchor="middle">waveform</text>

  <path d="M130 240h22" stroke="#8390a0" stroke-width="3" marker-end="url(#clmA)"/>

  <!-- crossed-out RVQ stack, shown as what CALM removes -->
  <g transform="translate(166,206)" opacity="0.75">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="none" stroke="#b7bfc9" stroke-width="2"/>
    <rect x="0" y="24" width="30" height="20" rx="3" fill="none" stroke="#b7bfc9" stroke-width="2"/>
    <rect x="0" y="48" width="30" height="20" rx="3" fill="none" stroke="#b7bfc9" stroke-width="2"/>
    <path d="M-6 -6 36 74" stroke="#aeb7c3" stroke-width="3"/>
  </g>
  <text x="181" y="296" fill="#8390a0" font-family="monospace" font-size="13" text-anchor="middle">RVQ levels</text>

  <path d="M230 240h22" stroke="#8390a0" stroke-width="3" marker-end="url(#clmA)"/>

  <!-- VAE box -->
  <rect x="264" y="178" width="120" height="124" rx="11" fill="#fff" stroke="#2f62d6" stroke-width="2"/>
  <text x="324" y="234" fill="#152030" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">VAE</text>
  <text x="324" y="260" fill="#2f62d6" font-family="monospace" font-size="13" text-anchor="middle">one vector Z</text>

  <path d="M396 240h30" stroke="#8390a0" stroke-width="3" marker-end="url(#clmA)"/>
  <circle cx="440" cy="240" r="10" fill="#2f62d6"/>

  <path d="M460 240h22" stroke="#8390a0" stroke-width="3" marker-end="url(#clmA)"/>

  <!-- LM box -->
  <rect x="494" y="178" width="110" height="124" rx="11" fill="#fff" stroke="#2f62d6" stroke-width="2"/>
  <text x="549" y="226" fill="#152030" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">LM</text>
  <text x="549" y="248" fill="#5a6676" font-family="monospace" font-size="11" text-anchor="middle">past frames</text>
  <text x="549" y="264" fill="#5a6676" font-family="monospace" font-size="11" text-anchor="middle">&#8594; context</text>

  <path d="M616 240h22" stroke="#8390a0" stroke-width="3" marker-end="url(#clmA)"/>

  <!-- consistency head -->
  <rect x="650" y="178" width="60" height="124" rx="11" fill="#fff" stroke="#c7306b" stroke-width="2"/>
  <text x="680" y="222" fill="#152030" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Head</text>
  <text x="680" y="240" fill="#c7306b" font-family="monospace" font-size="10" text-anchor="middle">noise</text>
  <text x="680" y="254" fill="#c7306b" font-family="monospace" font-size="10" text-anchor="middle">&#8594; frame</text>

  <path d="M549 309v38h131" fill="none" stroke="#b88300" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="680" cy="347" r="3" fill="#b88300"/>

  <g fill="none" stroke="#c7306b" stroke-width="3" stroke-dasharray="5 5">
    <circle cx="680" cy="347" r="11"/>
  </g>

  <text x="46" y="390" fill="#2f62d6" font-family="monospace" font-size="16">observed</text>
  <text x="494" y="390" fill="#2f62d6" font-family="monospace" font-size="16">context</text>
  <text x="630" y="390" fill="#c7306b" font-family="monospace" font-size="16">predicted</text>
</svg>
