<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="icon-mask">
      <circle cx="250" cy="250" r="222" fill="white"/>
      <g transform="translate(238,262) scale(9) translate(-12,-12)"
         stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z"/>
      </g>
    </mask>

    <filter id="carved" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#000" result="black"/>
      <feComposite operator="out" in="black" in2="SourceGraphic" result="inv"/>
      <feGaussianBlur in="inv" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="4" dy="5" result="shifted"/>
      <feComposite operator="in" in="shifted" in2="SourceGraphic" result="shadow-clipped"/>
      <feFlood flood-color="#1c1f38" flood-opacity="0.5" result="shadow-color"/>
      <feComposite operator="in" in="shadow-color" in2="shadow-clipped" result="inner-shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner-shadow"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White border circle -->
  <circle cx="250" cy="250" r="240" fill="white"/>

  <!-- Navy circle with newspaper carved in -->
  <circle cx="250" cy="250" r="222" fill="#484D6D"
          mask="url(#icon-mask)" filter="url(#carved)"/>

  <!-- Coral sparkles: nested svg for reliable scaling/positioning -->
  <svg x="272" y="100" width="120" height="120" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
       fill="none" stroke="#F07B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z"/>
  </svg>
</svg>
